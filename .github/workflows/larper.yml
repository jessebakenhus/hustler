name: 99% larping

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  fake-work:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: checkout-repo
        uses: actions/checkout@v4

      - name: git-identity
        run: |
          git config --global user.name "Jesse Bakenhus"
          git config --global user.email "jesse.bakenhus@gmx.de"

      - name: gen-activities
        run: |
          for i in {1..10}
          do
            echo "Larping erhöht um $i% um $(date)" >> grind.log
            git add grind.log
            git commit -m "refactor: critical enterprise sync patch #$i [skip ci]"
            sleep 1
          done

      - name: push
        run: git push

